# LOCAL DEV ONLY. DRAFT — NOT CERTIFIED. Do not deploy this stack to a shared environment.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lorb
      POSTGRES_PASSWORD: lorb
      POSTGRES_DB: lorb_mvp
    ports: ["5432:5432"]
    volumes:
      - ./packages/runtime-api/src/db/migrations:/docker-entrypoint-initdb.d:ro

  # Runtime API. The MVP evidence store is process-local in-memory state that the Evidence API
  # imports directly from the Runtime API's core module, and the Evidence API verifies launch
  # descriptors with the Runtime's own signing key — so src/server.ts mounts both route sets on this
  # one listener. Restarting this service loses all attempts, evidence, and agent-authored quizzes.
  runtime-api:
    build: { context: ., dockerfile: Dockerfile }
    environment:
      PORT: "3000"
      RUNTIME_PUBLIC_ISSUER: http://localhost:3000
      PLAYER_SHELL_ORIGIN: http://localhost:3200
      EVIDENCE_API_ENDPOINT: http://localhost:3000/api/v1/evidence/statements
      IES_ISSUER: http://stub-ies:4000
      IES_JWKS_URL: http://stub-ies:4000/.well-known/jwks.json
      DATABASE_URL: postgres://lorb:lorb@postgres:5432/lorb_mvp
      PSEUDONYM_TENANT_SECRET: ${PSEUDONYM_TENANT_SECRET:?set PSEUDONYM_TENANT_SECRET to 32 random bytes as hex}
      # Credential for the internal service-to-service launch surface. Never issued to a browser,
      # never shared with the agent-facing MCP bearer token.
      RUNTIME_INTERNAL_SERVICE_TOKEN: ${RUNTIME_INTERNAL_SERVICE_TOKEN:?set RUNTIME_INTERNAL_SERVICE_TOKEN}
    ports: ["3000:3000"]
    depends_on: [postgres, stub-ies]

  # STUB — NOT PRODUCTION. Synthetic identity simulator.
  stub-ies:
    build: { context: ., dockerfile: Dockerfile.stub-ies }
    environment:
      PORT: "4000"
      IES_PUBLIC_ISSUER: http://stub-ies:4000
    ports: ["4000:4000"]

  # STUB — NOT PRODUCTION. Synthetic class/roster simulator; LORB-001 has no roster concept.
  stub-roster:
    build: { context: ., dockerfile: Dockerfile.stub-roster }
    environment:
      PORT: "4100"
    ports: ["4100:4100"]

  # Player Shell plus the bundled content packages, including the shared quiz-player.
  player-shell:
    build: { context: ., dockerfile: Dockerfile.player-shell }
    ports: ["3200:8080"]

  # Agent-facing MCP server. PoC bearer authentication only — see packages/mcp-connector/README.md.
  mcp-connector:
    build: { context: ., dockerfile: Dockerfile.mcp-connector }
    environment:
      PORT: "4200"
      AUTH_MODE: poc
      MCP_POC_BEARER_TOKEN: ${MCP_POC_BEARER_TOKEN:?set MCP_POC_BEARER_TOKEN to at least 32 characters}
      RUNTIME_INTERNAL_SERVICE_TOKEN: ${RUNTIME_INTERNAL_SERVICE_TOKEN:?set RUNTIME_INTERNAL_SERVICE_TOKEN}
      RUNTIME_API_BASE: http://runtime-api:3000
      EVIDENCE_API_BASE: http://runtime-api:3000
      ROSTER_API_BASE: http://stub-roster:4100
    ports: ["4200:4200"]
    depends_on: [runtime-api, stub-roster]
