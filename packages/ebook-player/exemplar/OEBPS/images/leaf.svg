    <circle cx="342" cy="100" r="4"/><circle cx="342" cy="116" r="4"/><circle cx="342" cy="130" r="4"/>
    <circle cx="370" cy="100" r="4"/><circle cx="370" cy="116" r="4"/><circle cx="370" cy="130" r="4"/>
    <circle cx="398" cy="100" r="4"/><circle cx="398" cy="116" r="4"/><circle cx="398" cy="130" r="4"/>
