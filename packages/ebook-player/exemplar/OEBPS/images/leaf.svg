<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 260" width="580" height="260" role="img" aria-labelledby="t d">
  <title id="t">Cross-section of a leaf</title>
  <desc id="d">A leaf drawn in section. Sunlight arrives from above; the palisade layer near the top is packed with chloroplasts; stomata on the underside let carbon dioxide in and oxygen out; veins carry water in and sugar away.</desc>
