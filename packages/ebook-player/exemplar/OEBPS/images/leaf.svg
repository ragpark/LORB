    <circle cx="174" cy="100" r="4"/><circle cx="174" cy="116" r="4"/><circle cx="174" cy="130" r="4"/>
    <circle cx="202" cy="100" r="4"/><circle cx="202" cy="116" r="4"/><circle cx="202" cy="130" r="4"/>
    <circle cx="230" cy="100" r="4"/><circle cx="230" cy="116" r="4"/><circle cx="230" cy="130" r="4"/>
    <circle cx="258" cy="100" r="4"/><circle cx="258" cy="116" r="4"/><circle cx="258" cy="130" r="4"/>
    <circle cx="286" cy="100" r="4"/><circle cx="286" cy="116" r="4"/><circle cx="286" cy="130" r="4"/>
