<!doctype html><html lang="en-GB"><body><button id="complete">Complete</button><script>
// The shell is the embedding document, so its exact origin comes from document.referrer — never a
// wildcard. The previous hard-coded localhost origin only ever worked in local development.
const shell=document.referrer?new URL(document.referrer).origin:'http://localhost:3200';
const send=(type,payload)=>parent.postMessage({protocol:'lorb-player',version:'1.0',type,message_id:crypto.randomUUID(),correlation_id:crypto.randomUUID(),reply_to:null,sent_at:new Date().toISOString(),payload},shell);
// state.put first: it is what moves the attempt CREATED -> STARTED, and the Runtime only accepts a
// completion from STARTED.
document.querySelector('#complete').onclick=()=>{send('state.put',{state:{acknowledged:true}});send('experience.complete',{})};
</script></body></html>
