    approaches: [schema_registry_compat, consumer_driven_contract, provider_conformance, e2e_synthetic, property_based, negative_security]
  test_fixtures_per_contract: 16
  anti_requirements_data_count: 49
  contract_lifecycle: [DRAFT, EXPERIMENTAL, AVAILABLE, GENERALLY_AVAILABLE, DEPRECATED, RETIRED]
  deprecation_notice_minimums:
