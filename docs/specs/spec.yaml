data_and_integration:
  identifier_scheme:
    canonical: UUIDv7
    external_standard_exception: UUIDv4_where_required
    slugs_role: alias_only
  entities_count: 40
  entities_pseudonymous_carrying: 11
  entities_pseudonymous_prohibited: 14
  systems_of_record:
    lorb_owned: 21
    federated: 9
  api_surfaces:
    - name: Runtime
      base: /api/v1/runtime
      auth: OAuth2_OIDC_bearer
      audience: lorb-runtime
      idempotency: mandatory_for_state_changes
      error_contract: RFC_9457_problem_details
    - name: Publisher
      base: /api/v1/publisher
      auth: workforce_federated_OAuth
      idempotency: mandatory
      error_contract: RFC_9457_problem_details
    - name: Administration
      base: /api/v1/admin
      auth: Pearson_workforce_identity
      idempotency: mandatory
      error_contract: RFC_9457_problem_details
    - name: Integrator
      base: /api/v1/integrator
      auth: OAuth_client_credentials_or_federated
      idempotency: mandatory
      error_contract: RFC_9457_problem_details
    - name: Evidence
      base: /api/v1/evidence
      auth: launch_scoped_token_or_service_OAuth
      idempotency: mandatory_via_xAPI_statement_UUID
      error_contract: RFC_9457_problem_details
    - name: Callback
      base: /api/v1/callbacks
      auth: signed_callback_or_mTLS_or_OAuth
      idempotency: mandatory_via_event_id_plus_subscription
      error_contract: RFC_9457_problem_details
  api_versioning_open_question: >
    Six surfaces share /api/v1/*; per-surface deprecation notice periods differ.
    Independence policy to be clarified (BLK-14).
  protocols_allowed: [REST_JSON, AsyncAPI_events, xAPI, LTI_1_3, postMessage_versioned, gRPC_private_only]
  protocols_prohibited_release_one: [public_GraphQL, direct_DB_integration]
  events_produced_count: ~40
  events_subscribed_count: 13
  event_naming_convention: "lorb.<domain>.<event>.v1"
  event_delivery:
    callback_guarantee: at_least_once
    receiver_dedup_required_key: "(subscription_id, event_id)"
    envelope: CloudEvents_1_0
    schema: JSON_Schema_with_semver
  ordering:
    global: none
    per_aggregate: [attempt_id, object_id, package_id, subscription_id]
  schema_contracts:
    - launch_descriptor
    - player_manifest
    - package_manifest
    - postMessage_protocol
    - accessibility_declaration
    - xapi_lorb_core_evidence_profile
  launch_descriptor:
    format: JWS_compact
    signing_algorithm: ES256
    typ: lorb-launch+jwt
    required_claims_count: 20
    conditional_claims_count: 16
    prohibited_content:
      - learner_name
      - learner_email
      - learner_date_of_birth
      - class_roster
      - arbitrary_free_text
      - provider_secrets
      - full_entitlement_detail
      - arbitrary_theme_tokens
      - arbitrary_return_url
      - arbitrary_callback_endpoint
  pseudonymisation:
    function: HMAC-SHA-256
    inputs: [tenant_specific_secret, issuer, subject, purpose]
    secret_residency: UK
    secret_exposure_to_runtime: false
  data_flow_diagrams:
