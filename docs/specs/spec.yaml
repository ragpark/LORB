product_intent:
  description: >
    LORB is a metadata-driven, repository-scoped platform capability for
    registering, resolving, launching, presenting and instrumenting reusable
    learning objects across ActiveHub and approved consuming platforms.
  positioning:
    net_new_capability: true
    replicates_prizm: true
    replaces_prizm: false
    coexistence_required: true
    authentication_reused_from: [ActiveHub, IES]
    audience: [corporate, HE, K-12, adult]
    audience_includes_children: true
    launch_contract_carries_user_identifier: true
    xapi_actor_pseudonymous: true
  goals:
    - id: G-01
      title: Establish a canonical learning-object model
    - id: G-02
      title: Provide a stable launch contract
    - id: G-03
      title: Decouple consumers, players and providers
    - id: G-04
      title: Support governed extensibility
    - id: G-05
      title: Provide consistent progress and evidence services
    - id: G-06
      title: Make operations observable and supportable
    - id: G-07
      title: Enable controlled migration and coexistence
  non_goals:
    - LORB is not an LMS
    - LORB does not author content
    - LORB does not manage learner identity (delegated; but processes pseudonymous subject)
    - LORB does not manage commercial entitlement or licensing
    - LORB does not replace PRIZM
    - LORB is not an analytics dashboard
    - LORB is not an SIS; may act as LTI platform/tool/mediation
    - LORB does not include AI-driven adaptivity, recommendation or generation
    - LORB is not a CMS
  success_measures:
    - id: E.1
      measure: Registration-to-first-launch time
      target: "<= 1 working day UI; <= 30 min automated"
      instrumented: PROPOSED
    - id: E.2
      measure: Successful launch rate
      target: ">= 99.5% monthly"
      instrumented: PROPOSED
    - id: E.3
      measure: Platform-attributable attempt completion loss
      target: "< 0.1%"
      instrumented: PROPOSED
    - id: E.4
      measure: Package reuse across products
      target: ">= 30% at 12 months"
      instrumented: PROPOSED
    - id: E.5
      measure: Evidence integrity durably stored
      target: ">= 99.9%"
      instrumented: PROPOSED
      blocked_by: [BLK-12]
    - id: E.6
      measure: Initial repository coverage
      target: "all agreed migration packages + 4 validated delivery profiles"
      instrumented: PROPOSED
    - id: E.7a
      measure: Launch resolution availability
      target: ">= 99.95% monthly"
      instrumented: PROPOSED
    - id: E.7b
      measure: Resolver latency
      target: "p50<=150ms; p95<=400ms; p99<=750ms"
      instrumented: PROPOSED
    - id: E.7c
      measure: Player initialisation p95
      target: "<= 2s to player-ready"
      instrumented: PROPOSED
    - id: E.7d
      measure: Evidence delivery latency
      target: "99% within 5s"
      instrumented: PROPOSED
    - id: E.8a
      measure: Unauthorised successful launches
      target: "0"
      instrumented: PROPOSED
    - id: E.8b
      measure: Open critical/high auth bypass at release
      target: "0"
      instrumented: PROPOSED
    - id: E.9
      measure: Accessibility WCAG 2.2 AA on chrome and admin
      target: "conformance"
      instrumented: PROPOSED
    - id: E.10a
      measure: Traceability with valid identifiers
      target: ">= 99%"
      instrumented: PROPOSED
    - id: E.10b
      measure: Failure category assigned (not UNKNOWN_ERROR)
      target: ">= 95%"
      instrumented: PROPOSED
    - id: E.10c
      measure: Migration compatibility of selected cohort
      target: "100% pass agreed conformance tests"
      instrumented: PROPOSED
    - id: E.10d
      measure: Onboarding efficiency
      target: ">= 50% reduction second+ consumer"
      instrumented: PROPOSED
    - id: E.10e
      measure: Contract stability
      target: "no unannounced breaking changes"
      instrumented: PROPOSED
  risks_summary_count: 20
  assumptions_summary_count: 21

