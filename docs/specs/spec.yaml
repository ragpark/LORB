    - DFD-02_ActiveHubEmbeddedLearnerLaunch
    - DFD-03_LTIProviderRedirect
    - DFD-04_StateAndAttemptLifecycle
    - DFD-05_EvidenceToLRS
    - DFD-06_EvidenceToGPSDACInsightsCallbacks
    - DFD-07_PRIZMToLORBMigration
    - DFD-08_SubjectDeletion
    - DFD-09_OperationalInvestigation
    - DFD-10_KeyRotation
  dfd_boundary_prohibitions: 12
