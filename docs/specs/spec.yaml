# ==============================================================================
# LORB — SPECIFICATION AND IMPLEMENTATION RECORD
# ==============================================================================
# The structured record of what LORB is, what it refuses to do, and what is
# actually built. Where an item is implemented, this file says so and names the
# test that holds it; where it is not, it says that too.
#
# The anti-requirements below are not aspirations. Most of them have a test that
# fails if the control is removed — see tests/anti-requirements/. Treat the whole
# list as constraints on any change, and treat a change to one as a contract
# change rather than a refactor.
# ==============================================================================

specification:
  id: LORB-001
  title: Learning Object Repository and Broker
  product_area: Learning Experience Delivery
  status: IMPLEMENTED
  language_region: en-GB
  last_updated_utc: "2026-08-25T00:00:00Z"

implementation_status:
  runtime_api: IMPLEMENTED             # launch, attempts, catalogue, publisher, admin, internal
  evidence_api: IMPLEMENTED            # acceptance, actor and attempt binding, durable outbox
  evidence_forwarder: IMPLEMENTED      # claim/retry/backoff/dead-letter, xAPI PUT with statementId
  player_shell: IMPLEMENTED            # sandboxed iframe, nonce-authenticated MessageChannel
  learner_portal: IMPLEMENTED
  administration_workspace: IMPLEMENTED
  operations_console: IMPLEMENTED
  agent_connector: IMPLEMENTED         # OAuth resource server, roster scoped by explicit link
  persistence: POSTGRES                # system of record for every mutable surface
  identity: DELEGATED_TO_OIDC_PROVIDER
  observability: IMPLEMENTED           # structured logs, Prometheus metrics, health and readiness
  # Surfaces named in the original scope that are not built. Nothing depends on
  # them, and none is stubbed — a caller gets a 404, not a pretend answer.
  integrator_api: NOT_BUILT
  callback_api: NOT_BUILT
  developer_portal: NOT_BUILT
  provider_adapters: NOT_BUILT
  scorm_cmi5_lti: NOT_BUILT
  prizm_coexistence: NOT_BUILT

product_intent:
  description: >
    LORB is a metadata-driven, repository-scoped platform capability for
    registering, resolving, launching, presenting and instrumenting reusable
    learning objects across consuming platforms.
  positioning:
    audience: [corporate, HE, K-12, adult]
    audience_includes_children: true
    launch_contract_carries_user_identifier: true
    xapi_actor_pseudonymous: true
    identity: delegated_to_external_oidc_provider
  goals:
    - {id: G-01, title: Establish a canonical learning-object model, status: IMPLEMENTED}
    - {id: G-02, title: Provide a stable launch contract, status: IMPLEMENTED}
    - {id: G-03, title: Decouple consumers, players and providers, status: PARTIAL, note: provider adapters not built}
    - {id: G-04, title: Support governed extensibility, status: IMPLEMENTED, note: launch policies and player versions}
    - {id: G-05, title: Provide consistent progress and evidence services, status: IMPLEMENTED}
    - {id: G-06, title: Make operations observable and supportable, status: IMPLEMENTED}
    - {id: G-07, title: Enable controlled migration and coexistence, status: NOT_BUILT}
  non_goals:
    - LORB is not an LMS
    - LORB does not author content
    - LORB does not manage learner identity (delegated; processes a pseudonymous subject)
    - LORB does not manage commercial entitlement or licensing
    - LORB is not an analytics dashboard
    - LORB is not an SIS
    - LORB does not include AI-driven adaptivity, recommendation or generation
    - LORB is not a CMS

service_level_objectives:
  # Each maps to a signal the platform actually emits. See docs/runbooks/observability.md.
  - {id: E.2,  measure: Successful launch rate, target: ">= 99.5% monthly", signal: lorb_launches_total}
  - {id: E.3,  measure: Attempt loss, target: "< 0.1% of started attempts ending without a terminal state", signal: lorb_attempt_transitions_total}
  - {id: E.5,  measure: Evidence durability, target: ">= 99.9% of accepted statements delivered", signal: lorb_evidence_forwarded_total}
  - {id: E.7a, measure: Launch availability, target: ">= 99.95% monthly", signal: readiness probe and lorb_http_requests_total}
  - {id: E.7b, measure: Launch latency, target: "p95 <= 400ms; p99 <= 750ms", signal: lorb_http_request_duration_seconds}
  - {id: E.7d, measure: Evidence delivery latency, target: "99% within 5s", signal: lorb_evidence_delivery_seconds}
  - {id: E.8a, measure: Unauthorised successful launches, target: "0", signal: "lorb_evidence_statements_total actor_mismatch, and the audit trail"}
  - {id: E.10b, measure: Failure category assigned (not UNKNOWN_ERROR), target: ">= 95%", signal: lorb_http_requests_total by problem code}
  # Measured only once the platform carries real usage, and stated here so they
  # are not quietly forgotten:
  - {id: E.1,  measure: Registration-to-first-launch time, target: "<= 1 working day via UI; <= 30 min automated", signal: NOT_INSTRUMENTED}
  - {id: E.4,  measure: Package reuse across products, target: ">= 30% at 12 months", signal: NOT_INSTRUMENTED}
  - {id: E.9,  measure: Accessibility WCAG 2.2 AA on chrome and admin, target: conformance, signal: MANUAL_AUDIT_REQUIRED}

ux_and_accessibility:
  accessibility_standard: WCAG 2.2 AA
  accessibility_verification: >
    Automated axe checks run against the administration workspace. A full manual
    audit against WCAG 2.2 AA — keyboard-only journeys, screen-reader output,
    reflow, and the player chrome inside the sandboxed iframe — has not been done
    and cannot be done by a test suite. It is a prerequisite for a deployment
    serving learners with access needs.
  language: en-GB
  error_taxonomy:
    implemented_in: packages/runtime-api/src/services/problem.ts
    format: RFC_9457_problem_details
    codes:
      - LAUNCH_CONTEXT_INVALID
      - AUTHENTICATION_EXPIRED
      - ACCESS_DENIED
      - ENTITLEMENT_UNAVAILABLE
      - OBJECT_NOT_FOUND
      - OBJECT_NOT_PUBLISHED
      - OBJECT_RETIRED
      - PACKAGE_UNAVAILABLE
      - PLAYER_UNSUPPORTED
      - BROWSER_UNSUPPORTED
      - NETWORK_INTERRUPTED
      - PROVIDER_UNAVAILABLE
      - STATE_LOAD_FAILED
      - STATE_SAVE_FAILED
      - ATTEMPT_CONFLICT
      - ATTEMPT_LIMIT_REACHED
      - SESSION_EXPIRED
      - CONTENT_SECURITY_BLOCKED
      - PLAYER_RUNTIME_ERROR
      - EVIDENCE_DELIVERY_DELAYED
      - IDEMPOTENCY_KEY_REQUIRED
      - IDEMPOTENCY_KEY_REUSED
      - RATE_LIMITED
      - SERVICE_UNAVAILABLE
      - UNKNOWN_ERROR
  age_appropriate_design:
    driven_by: declared_product_context
    inferred_from_behaviour: false
    childrens_code_mapping: NOT_DONE

architecture:
  pattern: modular_monolith_with_separate_presentation_deployments
  deployable_units:
    - Runtime API (hosts the Evidence API and the evidence forwarder)
    - Player Shell and content packages
    - Learner portal
    - Administration workspace
    - Operations console
    - Agent connector
  persistence:
    system_of_record: postgres
    in_memory_backend: development_and_test_only
    production_refuses_in_memory: true
    enforced_by: tests/runtime-api/configuration.spec.ts
  tenancy:
    model: multi_repository_shared_platform
    isolation_keys: [tenant_id, repository_id, consumer_id]
    authorisation: repository_scoped_membership
  descriptor_signing:
    algorithm: ES256
    key_source: configuration
    rotation: active_plus_retiring_ring_published_in_jwks
    verification: by_kid
    enforced_by: tests/runtime-api/signing-keys.spec.ts
  state_and_attempt:
    lifecycle: [CREATED, STARTED, SUSPENDED, RESUMED, COMPLETED, ABANDONED, EXPIRED, VOIDED]
    concurrency: optimistic_revision_check_in_single_statement
    expiry: swept_to_EXPIRED_by_maintenance_loop
    enforced_by: tests/runtime-api/persistence.spec.ts
  evidence:
    acceptance_and_delivery_separated: true
    outbox: durable_postgres
    claiming: for_update_skip_locked
    retry: exponential_backoff_with_full_jitter
    terminal_failure: dead_letter_visible_and_replayable
    payload_immutable: enforced_by_database_trigger
    deletes_refused: enforced_by_database_trigger
    enforced_by: [tests/evidence-forwarder/delivery.spec.ts, tests/runtime-api/persistence.spec.ts]
  security:
    sandboxing: iframe_without_allow_same_origin
    module_channel: nonce_authenticated_MessageChannel
    rate_limiting: per_replica_token_bucket_on_public_surfaces
    threat_model: NOT_COMMISSIONED
  observability:
    logs: structured_json_redacted_at_serialiser
    metrics: prometheus
    correlation_headers: [X-Correlation-ID, traceparent]
    probes: {liveness: /health, readiness: /ready}

data_and_integration:
  identifier_scheme: {canonical: UUID, slugs_role: alias_only}
  api_surfaces:
    - {name: Runtime,        base: /api/v1/runtime,   auth: OIDC bearer,       status: IMPLEMENTED}
    - {name: Evidence,       base: /api/v1/evidence,  auth: launch descriptor, status: IMPLEMENTED}
    - {name: Publisher,      base: /api/v1/publisher, auth: OIDC bearer + admin role, status: IMPLEMENTED}
    - {name: Administration, base: /api/v1/admin,     auth: OIDC bearer + admin role, status: IMPLEMENTED}
    - {name: Internal,       base: /api/v1/internal,  auth: service credential, status: IMPLEMENTED}
    - {name: Integrator,     base: /api/v1/integrator, status: NOT_BUILT}
    - {name: Callback,       base: /api/v1/callbacks,  status: NOT_BUILT}
  idempotency:
    required_on: every_state_changing_endpoint
    storage: durable_scoped_by_surface
    replay_of_different_request: refused_409
  pseudonymisation:
    function: HMAC-SHA-256
    inputs: [tenant_specific_secret, issuer, subject, purpose]
    reverse_mapping_stored: false
    note: >
      A class result recomputes the pseudonym from the roster at read time. The
      pairing exists for the duration of that request only, so no standing
      re-identification table exists. Rotating the secret invalidates the actor
      on all historical evidence — see docs/runbooks/key-rotation.md.
  launch_descriptor:
    format: JWS_compact
    signing_algorithm: ES256
    typ: lorb-launch+jwt
    lifetime_seconds: {min: 60, max: 900, default: 600}
    prohibited_content:
      - learner_name
      - learner_email
      - learner_date_of_birth
      - class_roster
      - arbitrary_free_text
      - provider_secrets
      - full_entitlement_detail
      - arbitrary_theme_tokens
      - arbitrary_return_url
      - arbitrary_callback_endpoint
    enforced_by: tests/anti-requirements/enforcement.spec.ts

anti_requirements:
  # Constraints on every change. Items marked ENFORCED have a test that fails if
  # the control is removed; see tests/anti-requirements/README-anti-requirements.md.
  architecture:
    - {rule: no_in_memory_session_state_as_system_of_record, status: ENFORCED}
    - {rule: no_ephemeral_descriptor_signing_key_in_production, status: ENFORCED}
    - {rule: no_wildcard_postMessage_origins, status: ENFORCED}
    - {rule: no_wildcard_CORS_in_production, status: ENFORCED}
    - {rule: no_built_in_consumer_origin_in_production, status: ENFORCED}
    - {rule: no_unsandboxed_third_party_iframe_content, status: ENFORCED}
    - {rule: no_long_lived_launch_URLs, status: ENFORCED}
    - {rule: no_silent_fallback_to_different_object_or_provider, status: ENFORCED}
    - {rule: no_modification_of_published_package_versions_in_place, status: ENFORCED}
    - {rule: no_duplicate_completion_or_grade_processing, status: ENFORCED}
    - {rule: no_learner_entered_content_in_logs_or_traces, status: ENFORCED}
    - {rule: no_secrets_in_source_control_or_ordinary_config, status: ENFORCED}
    - {rule: no_email_or_learner_name_as_operational_key, status: ENFORCED}
    - {rule: no_provider_secrets_in_launch_descriptors, status: ENFORCED}
    - {rule: no_building_new_identity_provider, status: HELD_BY_DESIGN}
    - {rule: no_building_new_entitlement_engine, status: HELD_BY_DESIGN}
    - {rule: no_building_LMS_CMS_gradebook_or_AI_runtime_inside_LORB, status: HELD_BY_DESIGN}
    - {rule: no_treating_pseudonymous_evidence_as_non_personal, status: HELD_BY_DESIGN}
    - {rule: no_treating_hosting_platform_logs_as_sufficient_observability, status: ENFORCED}
    - {rule: no_deployment_without_synthetic_probes_runbooks_restore_testing, status: RUNBOOKS_WRITTEN_RESTORE_TESTING_IS_OPERATOR_OWNED}
    - {rule: no_manual_production_data_correction_without_auditable_case, status: PARTIAL, note: audit trail exists; the process is the operator's}
  data_and_integration:
    - {rule: no_learner_name_email_dob_postal_in_descriptors, status: ENFORCED}
    - {rule: no_learner_free_text_in_evidence_results, status: ENFORCED, note: result.response is an option identifier}
    - {rule: no_floating_package_or_player_version_in_signed_descriptor, status: ENFORCED}
    - {rule: no_mutable_published_manifest, status: ENFORCED}
    - {rule: no_arbitrary_return_url_or_callback_url_at_launch, status: ENFORCED}
    - {rule: no_wildcard_or_permissive_origin_reflection, status: ENFORCED}
    - {rule: no_attempt_event_without_attempt_id_and_object_version_binding, status: ENFORCED}
    - {rule: no_duplicate_business_effect_from_repeated_message, status: ENFORCED}
    - {rule: no_exactly_once_claim_without_end_to_end_proof, status: HELD_BY_DESIGN, note: delivery is at-least-once with receiver-side dedup}
    - {rule: no_arbitrary_unbounded_JSON_state, status: ENFORCED}
    - {rule: no_state_write_without_concurrency_control, status: ENFORCED}
    - {rule: no_deletion_through_ordinary_CRUD_apis_for_evidence, status: ENFORCED}
    - {rule: no_correction_as_destructive_overwrite, status: ENFORCED}
    - {rule: no_external_identifier_as_LORB_primary_key, status: ENFORCED}
    - {rule: no_production_data_in_public_sandbox_fixtures, status: ENFORCED}
    - {rule: no_PII_in_schema_examples_logs_support_codes, status: ENFORCED}
    - {rule: no_feature_flag_bypassing_auth_or_isolation, status: ENFORCED}
    - {rule: no_browser_access_to_worker_or_internal_apis, status: ENFORCED}
    - {rule: no_raw_database_export_as_integration_contract, status: HELD_BY_DESIGN}
    - {rule: no_analytics_projection_as_authoritative_evidence_store, status: HELD_BY_DESIGN, note: the read model is explicitly a projection}

# ==============================================================================
# Prerequisites the code cannot satisfy
# ==============================================================================
# These are not defects and they do not block the software. They are decisions
# and assessments that belong to whoever deploys LORB and owns the data in it.
# Each is listed because it would be worse to leave it implicit.
operator_prerequisites:
  - id: data_residency
    decision: >
      Where the database lives. The platform stores pseudonymous learner data and
      is agnostic about the region; the residency obligations that apply to your
      learners are not. Decide the region before the first real learner, because
      moving a populated evidence store is a migration, not a setting.
  - id: data_protection_assessment
    decision: >
      A data protection impact assessment covering pseudonymous evidence, class
      rosters, and the audit trail. The platform's design decisions — no stored
      re-identification mapping, pseudonymous actors, append-only evidence — are
      inputs to that assessment, not a substitute for it. Children's data is in
      scope for the K-12 audience.
  - id: accessibility_audit
    decision: >
      A manual WCAG 2.2 AA audit of the three management surfaces and the player
      chrome. Automated checks catch a minority of real failures; keyboard-only
      journeys and screen-reader output inside a sandboxed iframe need a person.
  - id: threat_model
    decision: >
      A threat model against the deployed topology. The controls in this file are
      the ones the implementers knew to build; a threat model is how you find the
      ones they did not.
  - id: learning_record_store_contract
    decision: >
      Which learning record store, on what terms, with what retention. The
      forwarder speaks the xAPI statements resource and will deliver to any of
      them; which one holds a learner's achievement for how long is a contract.
  - id: content_governance
    decision: >
      Who may publish, and what review a package gets before it is published.
      The Publisher API enforces that a publisher is an authenticated
      administrator and that a module path stays under the player origin. It does
      not review content.
